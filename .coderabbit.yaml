# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration: https://docs.coderabbit.ai/reference/configuration
# Project conventions live in AGENTS.md, which CodeRabbit reads as code guidelines.

language: en-US

reviews:
  profile: chill
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false

  pre_merge_checks:
    # The project does not require XML docs on every member, so this check
    # only produced warnings on ordinary PRs.
    docstrings:
      mode: "off"

  path_filters:
    # Resource files: image data and designer-maintained strings.
    - "!**/*.resx"
    # Generated by ResGen from the .resx files.
    - "!**/Properties/Resources.Designer.cs"

  path_instructions:
    - path: "src/GuiRunner/**/*.cs"
      instructions: |
        The GUI targets .NET Framework 4.6.2 (net462) with C# 12, nullable
        reference types enabled and warnings as errors. Only suggest APIs that
        exist on net462. The code follows Model-View-Presenter: presenters
        work against view interfaces (I...View) and ITestModel so they can be
        tested with NSubstitute; point out logic that ends up in a view instead.
    - path: "src/GuiRunner/**/*.Designer.cs"
      instructions: |
        Generated by the WinForms designer. Do not comment on style, naming,
        member order or the absence of comments. Review layout values (Location,
        Size, Anchor, Dock, TabIndex) against the containing control and the
        code-behind that moves or resizes controls, and event handlers that are
        wired or removed.
    - path: "src/GuiRunner/*.Tests/**/*.cs"
      instructions: |
        NUnit 4 with NSubstitute; test projects are NUnitLite executables.
        Prefer Assert.That with constraints, as the existing tests do. Check
        that tests assert the behavior the PR changes, not only that calls
        happen.
    - path: "src/TestData/**"
      instructions: |
        Test input assemblies for unit and package tests. Failing, ignored,
        inconclusive and hanging tests are deliberate; do not suggest fixing them.
    - path: "**/*.cake"
      instructions: |
        Cake build scripts. build.cake loads the shared TestCentric.Cake.Recipe
        package, which defines BuildSettings, the standard tasks and the package
        test types; their source is not in this repository, so do not flag
        members as undefined only because they are not declared here.
        package-tests.cake defines the package tests and KnownExtensions.cake the
        extension packages they install. Check that package contents, expected
        test results and target runtimes stay consistent with each other.
